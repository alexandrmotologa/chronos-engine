spring:
  datasource:
    url: jdbc:h2:mem:chronos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

server:
  port: 8080

chronos:
  cluster:
    node-id: chronos-worker-primary
    heartbeat-interval-ms: 3000
    lease-duration-ms: 10000
  worker:
    enabled: true
    batch-size: 200
    poll-interval-ms: 1000
